<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MOMIQ | تفاصيل المنتج" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="assets/logo.png" type="image/svg+xml" />

  <body>
    <header class="header">
      <div class="container header__inner">
        <a class="brand" href="index.html"><img src="assets/logo.png" alt="MOMIQ" class="brand__logo" /><div class="brand__text"><span class="brand__title">MOMIQ</span><span class="brand__subtitle" data-i18n="brand_subtitle">مومِك</span></div></a>
        <nav class="nav" data-nav aria-label="MOMIQ">
          <a href="index.html" class="nav__link" data-i18n="nav_home">الرئيسية</a>
          <a href="store.html" class="nav__link" data-i18n="nav_store">المتجر</a>
          <a href="mom-profile.html" class="nav__link" data-i18n="nav_mom">ملف الأم</a>
          <a href="prep-list.html" class="nav__link" data-i18n="nav_prep">قائمة التجهيز</a>
          <a href="gift-list.html" class="nav__link" data-i18n="nav_gifts">الهدايا</a>
          <a href="ai-assistant.html" class="nav__link" data-i18n="nav_ai">المساعد الذكي</a>
          <a href="cart.html" class="nav__link"><span data-i18n="nav_cart">السلة</span> (<span id="cartBadge">0</span>)</a>
          <a href="wishlist.html" class="nav__link" data-i18n="nav_wishlist">المفضلة</a>
          <a href="settings.html" class="nav__link" data-i18n="nav_settings">الإعدادات</a>
        </nav>
        <div class="actions">
          <button class="btn btn--ghost btn--small" id="langToggle" data-i18n="lang_toggle">English</button>
          <button class="nav__toggle" data-nav-toggle aria-expanded="false"><span aria-hidden="true">☰</span><span class="sr-only">Menu</span></button>
        </div>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <a href="store.html" class="btn btn--ghost btn--small" style="margin-bottom:1rem" data-i18n="common_back">رجوع</a>
          <div id="productContainer" class="grid" style="align-items:start"></div>
          <h2 style="margin-top:2rem" data-i18n="product_similar">منتجات مكملة</h2>
          <div class="grid" id="relatedGrid" style="margin-top:1rem"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__grid">
        <div class="footer__brand">
          <div class="brand"><img src="assets/logo.png" class="brand__logo" alt="MOMIQ" /><div class="brand__text"><span class="brand__title">MOMIQ</span><span class="brand__subtitle" data-i18n="brand_subtitle">مومِك</span></div></div>
          <p data-i18n="footer_about_text">تطبيق ويب متخصص في الأمومة يجمع المتجر وقوائم الهدايا والمساعد الذكي.</p>
        </div>
        <div><h3 data-i18n="footer_quick">روابط سريعة</h3><ul class="footer__list"><li><a href="store.html" data-i18n="nav_store">المتجر</a></li><li><a href="cart.html" data-i18n="nav_cart">السلة</a></li></ul></div>
        <div><p data-i18n="footer_rights">© 2026 MOMIQ</p></div>
      </div>
    </footer>

    <button class="whatsapp-fab" id="waFab" aria-label="WhatsApp">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path fill="#fff" d="M19.11 17.205c-.372 0-1.088 1.39-1.518 1.39a.63.63 0 0 1-.315-.1c-.802-.402-1.504-.817-2.163-1.447-.545-.516-1.146-1.29-1.46-1.963a.426.426 0 0 1-.073-.215c0-.33.99-.945.99-1.49 0-.143-.73-2.09-.832-2.335-.143-.372-.214-.487-.6-.487-.187 0-.36-.043-.53-.043-.302 0-.53.115-.746.315-.688.645-1.032 1.318-1.06 2.264v.114c-.015.99.472 1.977 1.017 2.78 1.23 1.82 2.506 3.41 4.554 4.34.616.287 2.035.888 2.722.888.817 0 2.15-.515 2.478-1.318.13-.33.244-.73.244-1.088 0-.058 0-.144-.03-.215-.1-.172-2.434-1.39-2.678-1.39zm-2.908 7.593c-1.747 0-3.48-.53-4.942-1.49L7.793 24.41l1.132-3.337a8.955 8.955 0 0 1-1.72-5.272c0-4.955 4.04-8.995 8.997-8.995S25.2 10.845 25.2 15.8c0 4.958-4.04 8.998-8.998 8.998zm0-19.798c-5.96 0-10.8 4.842-10.8 10.8 0 1.964.53 3.898 1.546 5.574L5 27.176l5.974-1.92a10.807 10.807 0 0 0 16.03-9.455c0-5.958-4.842-10.8-10.802-10.8z"/></svg>
    </button>

    <script src="js/storage.js"></script>
    <script src="js/data.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script>
      function currentProduct() {
        const id = new URLSearchParams(location.search).get("id");
        return (window.MomiqProducts || []).find(item => item.id === id) || null;
      }

      function renderProduct() {
        const container = document.getElementById("productContainer");
        const relatedGrid = document.getElementById("relatedGrid");
        const product = currentProduct();

        if (!product) {
          container.innerHTML = `<p class="hint">${t("item_not_found")}</p>`;
          relatedGrid.innerHTML = "";
          return;
        }

        const item = getProductText(product);
        const img = product.image || "assets/img/placeholder.svg";
        const gallery = (product.images && product.images.length ? product.images : [img]);
        const inWish = isInWishlist(product.id);

        container.innerHTML = `
          <div class="stack">
            <figure class="hero__card"><img src="${img}" alt="${item.name}" onerror="this.src='assets/img/placeholder.svg'"></figure>
            <div class="row">
              ${gallery.map(src => `<img class="thumb" src="${src}" alt="${item.name}" width="72" height="72" style="border-radius:12px;border:1px solid var(--color-border)" onerror="this.src='assets/img/placeholder.svg'">`).join("")}
            </div>
          </div>
          <div class="card">
            <div class="card__body">
              <span class="badge">${categoryLabel(product.category)}</span>
              <h1>${item.name}</h1>
              <p>${item.desc || item.shortDesc || ""}</p>
              <div class="price" style="font-size:1.3rem">${formatPrice(product.price)}</div>
              <div class="field" style="max-width:140px">
                <label for="qty">${t("product_qty")}</label>
                <input class="input" type="number" id="qty" min="1" value="1">
              </div>
              <div class="row">
                <button class="btn btn--primary" type="button" id="addCartBtn">${t("add_to_cart")}</button>
                ${wishBtnHtml(product.id)}
                <button class="btn btn--ghost" type="button" id="shareBtn">${t("product_share")}</button>
                <button class="btn btn--soft" type="button" id="waAskBtn">${t("product_whatsapp")}</button>
              </div>
            </div>
          </div>`;

        document.getElementById("addCartBtn").addEventListener("click", () => {
          const qty = document.getElementById("qty").value;
          addToCart({ id: product.id, name: item.name, price: product.price, image: img }, qty);
          showToast(t("added_to_cart"));
        });

        document.getElementById("shareBtn").addEventListener("click", async () => {
          const url = location.href;
          try {
            await navigator.clipboard.writeText(url);
            showToast(t("link_copied"));
          } catch (error) {
            prompt("MOMIQ", url);
          }
        });

        document.getElementById("waAskBtn").addEventListener("click", () => {
          openWhatsApp(`${getWhatsAppMsg()} — ${item.name}`);
        });

        const related = (window.MomiqProducts || []).filter(p => p.id !== product.id && p.category === product.category).slice(0, 3);
        relatedGrid.innerHTML = related.length ? related.map(productCardHtml).join("") : `<p class="hint">${t("common_empty")}</p>`;

        initWishButtons();
        refreshWishButtons();
      }

      document.addEventListener("DOMContentLoaded", () => {
        renderProduct();
        document.addEventListener("lang:changed", renderProduct);
      });
    </script>
  </body>
</html>
