<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MOMIQ | السلة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="assets/logo.png" type="image/svg+xml" />
  </head>
  <body>
    <header class="header"><div class="container header__inner"><a class="brand" href="index.html"><img src="assets/logo.png" class="brand__logo"/><div class="brand__text"><span class="brand__title">MOMIQ</span><span class="brand__subtitle" data-i18n="brand_subtitle">مومِك</span></div></a><nav class="nav" data-nav><a href="index.html" class="nav__link" data-i18n="nav_home">الرئيسية</a><a href="store.html" class="nav__link" data-i18n="nav_store">المتجر</a><a href="cart.html" class="nav__link"><span data-i18n="nav_cart">السلة</span> (<span id="cartBadge">0</span>)</a></nav><div class="actions"><button class="btn btn--ghost btn--small" id="langToggle" data-i18n="lang_toggle">English</button><button class="nav__toggle" data-nav-toggle aria-expanded="false"><span>☰</span></button></div></div></header>
    <main><section class="section"><div class="container"><header class="section__header"><h1 data-i18n="cart_title">السلة</h1><p data-i18n="cart_note">الأسعار تجريبية ولا يتم تنفيذ دفع حقيقي.</p></header><div id="cartList" class="grid"></div><div id="cartEmpty" style="display:none;opacity:.8" data-i18n="cart_empty">السلة فارغة</div><div class="card" style="margin-top:1rem;padding:1rem;max-width:400px;margin-inline-start:auto"><div style="display:flex;justify-content:space-between"><span data-i18n="cart_total">الإجمالي</span><span id="cartTotal">0 ريال</span></div></div></div></section></main>
    <footer class="footer"><div class="container footer__grid"><div class="footer__brand"><div class="brand"><img src="assets/logo.png" class="brand__logo"/><div class="brand__text"><span class="brand__title">MOMIQ</span><span class="brand__subtitle" data-i18n="brand_subtitle">مومِك</span></div></div><p data-i18n="footer_about_text">تطبيق ويب متخصص في الأمومة يجمع المتجر وقوائم الهدايا والمساعد الذكي.</p></div></div></footer>
    <button class="whatsapp-fab" id="waFab"><svg width="26" height="26" viewBox="0 0 32 32"><path fill="#fff" d="M19.11 17.205c-.372 0-1.088 1.39-1.518 1.39a.63.63 0 0 1-.315-.1c-.802-.402-1.504-.817-2.163-1.447-.545-.516-1.146-1.29-1.46-1.963a.426.426 0 0 1-.073-.215c0-.33.99-.945.99-1.49 0-.143-.73-2.09-.832-2.335-.143-.372-.214-.487-.6-.487-.187 0-.36-.043-.53-.043-.302 0-.53.115-.746.315-.688.645-1.032 1.318-1.06 2.264v.114c-.015.99.472 1.977 1.017 2.78 1.23 1.82 2.506 3.41 4.554 4.34.616.287 2.035.888 2.722.888.817 0 2.15-.515 2.478-1.318.13-.33.244-.73.244-1.088 0-.058 0-.144-.03-.215-.1-.172-2.434-1.39-2.678-1.39zm-2.908 7.593c-1.747 0-3.48-.53-4.942-1.49L7.793 24.41l1.132-3.337a8.955 8.955 0 0 1-1.72-5.272c0-4.955 4.04-8.995 8.997-8.995S25.2 10.845 25.2 15.8c0 4.958-4.04 8.998-8.998 8.998zm0-19.798c-5.96 0-10.8 4.842-10.8 10.8 0 1.964.53 3.898 1.546 5.574L5 27.176l5.974-1.92a10.807 10.807 0 0 0 16.03-9.455c0-5.958-4.842-10.8-10.802-10.8z"/></svg></button>
    <script src="js/storage.js"></script><script src="js/data.js"></script><script src="js/i18n.js"></script><script src="js/app.js"></script>
    <script>
      function load(){ const list=document.getElementById("cartList"); const empty=document.getElementById("cartEmpty"); const totalEl=document.getElementById("cartTotal"); const cart=JSON.parse(localStorage.getItem("momiq_cart")||"[]"); list.innerHTML=""; if(!cart.length){ empty.style.display="block"; totalEl.textContent="0 ريال"; return; } empty.style.display="none"; let sum=0; cart.forEach((it,idx)=>{ sum+=it.price*(it.qty||1); const div=document.createElement("article"); div.className="card"; div.innerHTML=`<div class="card__media"><img src="${it.img||'assets/img/placeholder.svg'}" onerror="this.src='assets/img/placeholder.svg'"></div><div class="card__body"><h3>${it.name}</h3><div class="card__meta"><span class="price">${it.price} ريال × <input type="number" min="1" value="${it.qty||1}" style="width:60px" onchange="chg(${idx},this.value)"></span><button class="btn btn--small btn--ghost" onclick="del(${idx})" data-i18n="common_delete">حذف</button></div></div>`; list.appendChild(div); }); totalEl.textContent=sum+" ريال"; }
      function chg(i,v){ const cart=JSON.parse(localStorage.getItem("momiq_cart")||"[]"); cart[i].qty=Math.max(1,Number(v)||1); localStorage.setItem("momiq_cart",JSON.stringify(cart)); document.dispatchEvent(new Event("cart:updated")); load(); }
      function del(i){ const cart=JSON.parse(localStorage.getItem("momiq_cart")||"[]"); cart.splice(i,1); localStorage.setItem("momiq_cart",JSON.stringify(cart)); document.dispatchEvent(new Event("cart:updated")); load(); }
      document.addEventListener("DOMContentLoaded",()=>{ load(); if(window.MomiqI18n.applyI18n) window.MomiqI18n.applyI18n(window.MomiqI18n.getLang()); });
    </script>
  </body>
</html>
